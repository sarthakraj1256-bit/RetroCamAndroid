name: Android build and unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retrocam-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare clearly named APK and checksum
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/RetroCam-debug.apk
          sha256sum release-artifacts/RetroCam-debug.apk > release-artifacts/RetroCam-debug.apk.sha256

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroCam-debug-apk
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14
